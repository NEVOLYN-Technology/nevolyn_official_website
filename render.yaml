# ==============================================================================
# Render Infrastructure Blueprint Schema for Saturn R&D Portfolio Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Spring Boot REST API Web Service (Docker Runtime)
  # ----------------------------------------------------------------------------
  - type: web
    name: saturn-rnd-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/projects
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: saturn-rnd-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: saturn-rnd-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: saturn-rnd-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: saturn-rnd-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: saturn-rnd-db
          property: password
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://saturn-rnd.vercel.app,http://localhost:3000

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Instance
# ------------------------------------------------------------------------------
databases:
  - name: saturn-rnd-db
    databaseName: saturn_rnd_db
    user: saturn_admin
    plan: free
    region: oregon
