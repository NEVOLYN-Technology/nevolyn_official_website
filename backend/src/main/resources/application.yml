server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: saturn-rnd-backend
  datasource:
    url: jdbc:h2:mem:saturn_rnd_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    com.saturn.rnd: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  storage:
    upload-dir: ./uploads/resumes
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://saturn-rnd.vercel.app
