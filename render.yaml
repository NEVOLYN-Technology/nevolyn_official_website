# ==============================================================================
# Render Infrastructure Blueprint Schema for Saturn R&D Portfolio Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Spring Boot REST API Web Service (Docker Runtime)
  # ----------------------------------------------------------------------------
  - type: web
    name: saturn-rnd-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/projects
    envVars:
      - key: PORT
        value: 8080
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://saturn-rnd.vercel.app,http://localhost:3000
