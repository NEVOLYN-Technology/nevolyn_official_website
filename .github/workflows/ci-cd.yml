name: Continuous Integration & Deployment (CI/CD) Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # Job 1: Next.js Frontend Verification & Build (Vercel Ready)
  # ============================================================================
  frontend-ci:
    name: Frontend (Next.js & TypeScript Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: pnpm run type-check

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: https://saturn-rnd-backend.onrender.com

  # ============================================================================
  # Job 2: Spring Boot Backend REST API Test Suite
  # ============================================================================
  backend-ci:
    name: Backend (Spring Boot & Maven Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run Spring Boot REST API Integration Tests
        working-directory: ./backend
        run: ./mvnw clean test -B

  # ============================================================================
  # Job 3: Automated Render CD Deployment Trigger
  # ============================================================================
  deploy-render-backend:
    name: Deploy Backend to Render
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Webhook Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render backend deployment hook..."
            curl -s -X POST "$DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping automated deploy trigger."
          fi
