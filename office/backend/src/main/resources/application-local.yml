spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.aodlrdjrqapcdviavofo}
    password: ${SPRING_DATASOURCE_PASSWORD:GovL3XIIrLiaO5ht}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

logging:
