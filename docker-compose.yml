# ==============================================================================
# NEVOLYN Technology — full local stack
# ==============================================================================
#   docker compose up --build
#
# Brings up Postgres + the Spring Boot API + the Next.js frontend, mirroring the
# production topology closely enough to catch profile and wiring mistakes that
# an H2-backed `mvnw spring-boot:run` cannot.
#
# Override any default by exporting the variable first, or with a .env file
# alongside this file.
#
# NOTE: the `version:` key was intentionally dropped — Compose v2 ignores it and
# warns that it is obsolete.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nevolyn_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nevolyn_db}
      POSTGRES_USER: ${POSTGRES_USER:-nevolyn_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nevolyn_admin} -d ${POSTGRES_DB:-nevolyn_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Spring Boot REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nevolyn_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nevolyn_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nevolyn_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      NEVOLYN_ADMIN_USERNAME: ${NEVOLYN_ADMIN_USERNAME:-admin}
      NEVOLYN_ADMIN_PASSWORD: ${NEVOLYN_ADMIN_PASSWORD}

      APP_CORS_ALLOWED_ORIGINS: ${NEVOLYN_ALLOWED_ORIGIN:-https://nevolyn.com,https://www.nevolyn.com}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://nevolyn.com}
      APP_BACKEND_URL: ${NEVOLYN_BACKEND_URL:-https://nevolyn.com}

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mail.nevolyn.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-info@nevolyn.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM:-info@nevolyn.com}
      SPRING_MAIL_SSL_ENABLE: ${SPRING_MAIL_SSL_ENABLE:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-false}
      APP_EMAIL_ADMIN: ${NEVOLYN_ADMIN_ADDRESS:-info@nevolyn.com}
      APP_EMAIL_FROM: ${SPRING_MAIL_FROM:-info@nevolyn.com}
      APP_EMAIL_SENDER_NAME: ${NEVOLYN_MAIL_SENDER_NAME:-NEVOLYN Technology}

      APP_UPLOAD_DIR: /app/uploads/resumes
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/uploads

  # ----------------------------------------------------------------------------
  # Next.js frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-https://nevolyn.com/api/v1}}
    container_name: nevolyn_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-https://nevolyn.com/api/v1}}
    depends_on:
      - backend

volumes:
  postgres_data:
  resume_uploads:
