# ==============================================================================
# Render Infrastructure Blueprint — NEVOLYN Technology Backend
# Spec: https://render.com/docs/blueprint-spec
# ==============================================================================
# Applied from the Render dashboard (Blueprints → New Blueprint Instance).
# Editing this file does not change a running service on its own — re-sync the
# blueprint, or mirror the change in the dashboard.
#
# Values marked `sync: false` are secrets: Render prompts for them once and
# never stores them in git. Never inline a password or API key here.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Spring Boot REST API (Docker runtime)
  # ----------------------------------------------------------------------------
  - type: web
    name: nevolyn-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon

    # Render polls this path continuously and refuses to promote a deploy that
    # never returns 2xx — a 404 here silently rolls every deploy back.
    #
    # Keep this pointed at Actuator: it is purpose-built, cheap, and reports DOWN
    # when the datasource is unreachable, so a broken instance is pulled from
    # rotation. Do not substitute a real API route — that runs a database query
    # on every poll and serves public data as a side effect.
    healthCheckPath: /actuator/health

    envVars:
      # Binds the server to the port Render routes public 443 traffic to.
      - key: PORT
        value: 8080

      # Activates application-prod.yml. WITHOUT THIS the service silently falls
      # back to the in-memory H2 dev profile: forms appear to work, then every
      # submission vanishes on the next restart.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ----------------------------------------------------------------------
      # Database
      # ----------------------------------------------------------------------
      # `connectionString` yields libpq form: postgres://user:pass@host/dbname
      # The PostgreSQL JDBC driver cannot parse that, so the
      # ApplicationEnvironmentPreparedEvent listener in NevolynApplication
      # rewrites it into jdbc:postgresql://host:5432/dbname and splits the
      # credentials out — before HikariCP starts.
      #
      # Do NOT try to assemble a JDBC URL here from separate host/port/name
      # vars: a blueprint `value:` is a literal, so "${DB_HOST}" is passed
      # through verbatim and the driver receives a nonsense URL.
      - key: DATABASE_URL
        fromDatabase:
          name: nevolyn-db
          property: connectionString

      # ----------------------------------------------------------------------
      # CORS + links
      # ----------------------------------------------------------------------
      # FUTURE CUSTOM DOMAIN: append the apex and www forms, e.g.
      #   https://nevolyn.com,https://www.nevolyn.com,https://nevolyn.vercel.app
      # The wildcard entry keeps Vercel preview deployments working.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://nevolyn.com,https://www.nevolyn.com,https://nevolyn.vercel.app,https://nevolyn-*.vercel.app,http://localhost:3000

      # Origin used to build the email verification link.
      - key: APP_FRONTEND_URL
        value: https://nevolyn.com

      # Origin used to build 1-click acknowledge button links in admin emails.
      - key: APP_BACKEND_URL
        value: https://api.nevolyn.com

      # ----------------------------------------------------------------------
      # Mail (Brevo)
      # ----------------------------------------------------------------------
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        value: b3c905001@smtp-brevo.com
      - key: SPRING_MAIL_HOST
        value: smtp-relay.brevo.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: APP_EMAIL_FROM
        value: info@nevolyn.com
      - key: APP_EMAIL_ADMIN
        value: admin@nevolyn.com

# ------------------------------------------------------------------------------
# Managed PostgreSQL
# ------------------------------------------------------------------------------
# NOTE ON THE FREE TIER: Render allows one free database per account and expires
# it after 30 days. If blueprint sync fails with a free-tier limit error, either
# delete the existing free database or remove this block and attach an
# already-provisioned database by setting DATABASE_URL as a `sync: false` secret
# on the web service above.
databases:
  - name: nevolyn-db
    databaseName: nevolyn_db
    user: nevolyn_admin
    plan: free
    region: oregon
