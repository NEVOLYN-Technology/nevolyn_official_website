# ─────────────────────────────────────────────────────────────
# application-prod.yml — Production Profile
# Uses isolated PostgreSQL schema `office` inside nevolyn_db by default
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NevolynOfficeProdPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${OFFICE_DB_SCHEMA:office}

  flyway:
    locations: classpath:db/migration
    schemas: ${OFFICE_DB_SCHEMA:office}
    default-schema: ${OFFICE_DB_SCHEMA:office}
    create-schemas: true
    properties:
      flyway:
        postgresql:
          transactional:
            lock: true

server:
  server-header: ""   # Do not reveal server info

logging:
  level:
    root: WARN
    com.nevolyn: INFO
    org.springframework.security: WARN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nevolyn.com,https://www.nevolyn.com,https://office.nevolyn.com,https://*.nevolyn.com,http://localhost:3000,http://localhost:3001}
  jwt:
    cookie-secure: true      # HTTPS only in production
    cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:}
  security:
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
