# ─────────────────────────────────────────────────────────────
# application-test.yml — Test Profile
# Uses: Testcontainers (auto-managed ephemeral PostgreSQL)
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///nevolyn_test?TC_REUSABLE=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    clean-on-validation-error: true

logging:
  level:
    root: WARN
    com.nevolyn: INFO

app:
  jwt:
    secret: test_jwt_secret_key_for_testing_only_64_chars_minimum_length_ok
    expiration-ms: 3600000   # 1 hour for tests
    cookie-secure: false
  security:
    allowed-local-prefixes: 127.0.0.1,::1
    allowed-public-ips:
    rd-wifi-secret:
