name: Backend Spring Boot REST API CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # Backend Spring Boot End-to-End REST API Test Suite
  # ============================================================================
  backend-api-tests:
    name: Spring Boot REST API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run Backend REST API Integration Test Suite
        working-directory: ./backend
        run: ./mvnw clean test -B
